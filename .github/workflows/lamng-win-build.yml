name: Lamng Windows Build

# Lamng fork: unsigned Windows installer for this fork's own use. Upstream's signed pipeline
# (dev-channel-win-build.yml) only runs in stablyai/orca. Push a `lamng-win-*` tag to build;
# tag pushes read this file from the tagged commit, so main never has to carry it.
on:
  push:
    tags:
      - 'lamng-win-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lamng-win-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    if: github.repository == 'Towfienes/LamngOrca'
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # pnpm must be on PATH before setup-node so setup-node can locate the store.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Same as upstream: electron-builder ships out/mobile-web, built from mobile's install.
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app
        shell: bash
        run: pnpm build:release

      # No certificate: the SignPath hook stays inert without its relay env, so this stays unsigned.
      - name: Package installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $env:ORCA_BUILD_COMMIT = (git rev-parse HEAD)
          pnpm run ensure:electron-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: orca-lamng-windows-${{ github.ref_name }}
          path: dist/orca-windows-setup.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
